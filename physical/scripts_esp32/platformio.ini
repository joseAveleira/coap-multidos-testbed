; Alternativa a Arduino IDE. Cinco entornos, un mismo firmware.
; Ajuste conservador para S3: 4 MB flash, sin PSRAM, sin GPIO específicos.
; Confirmar memoria y variante exactas antes de flashear una S3 Mini concreta.
[platformio]
src_dir = firmware/base
default_envs = esp32_01, esp32_02, esp32_03, esp32_04, esp32_05

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = dio
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32_01]
build_flags = ${env.build_flags} -DDEVICE_ID=1 -DPROFILE_ID=1
[env:esp32_02]
build_flags = ${env.build_flags} -DDEVICE_ID=2 -DPROFILE_ID=2
[env:esp32_03]
build_flags = ${env.build_flags} -DDEVICE_ID=3 -DPROFILE_ID=3
[env:esp32_04]
build_flags = ${env.build_flags} -DDEVICE_ID=4 -DPROFILE_ID=4
; ESP32-C6 N4 (RISC-V, Wi-Fi 6 + 802.15.4): requiere el núcleo Arduino 3.x
; (pioarduino, fijado). Solo se usa la Wi-Fi; Zigbee/Thread quedan sin usar.
[env:esp32_05]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
board_upload.maximum_size = 4194304
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DDEVICE_ID=5 -DPROFILE_ID=5

